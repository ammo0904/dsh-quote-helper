<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH 引用助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <span class="logo" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1a1 1 0 0 1 1 1v1a2 2 0 0 1-2 2h-1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1h1a6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z" />
          <path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1a1 1 0 0 1 1 1v1a2 2 0 0 1-2 2H4a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1h1a6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z" />
        </svg>
      </span>
      <div class="titles">
        <h1>DSH 引用助手 <span class="ver" id="ver"></span></h1>
        <p>框選文字 →「引用」「引用＋執行」送進輸入框、「複製」進剪貼簿</p>
      </div>
    </header>

    <label class="row">
      <span class="row-label">啟用浮動按鈕</span>
      <input type="checkbox" id="enabled" />
    </label>

    <label class="row">
      <span class="row-label">顯示「複製」按鈕</span>
      <input type="checkbox" id="showCopy" />
    </label>

    <label class="row">
      <span class="row-label">引用後換行（游標到下一行）</span>
      <input type="checkbox" id="breakLine" />
    </label>

    <label class="row textrow" for="execText">
      <span class="row-label">「引用＋執行」的執行文字</span>
      <input type="text" id="execText" maxlength="40" placeholder="執行！" spellcheck="false" />
    </label>

    <section class="group">
      <h2>啟用網址</h2>
      <ul class="sites" id="siteList"></ul>
      <div class="addrow">
        <input type="text" id="siteInput" placeholder="https://192.168.1.5:3080" spellcheck="false" />
        <button type="button" id="siteAdd">加入</button>
      </div>
      <p class="msg" id="siteMsg" hidden></p>
    </section>

    <section class="group">
      <h2>顯示範圍</h2>
      <label class="opt">
        <input type="radio" name="scope" value="conversation" />
        <span>只在對話區（建議）</span>
      </label>
      <label class="opt">
        <input type="radio" name="scope" value="anywhere" />
        <span>整頁任何位置（不含輸入框）</span>
      </label>
    </section>

    <section class="group">
      <h2>引用插入格式</h2>
      <label class="opt">
        <input type="radio" name="format" value="double" />
        <span>加上雙引號 “…”（預設）</span>
      </label>
      <label class="opt">
        <input type="radio" name="format" value="corner" />
        <span>加上中文引號「…」</span>
      </label>
      <label class="opt">
        <input type="radio" name="format" value="markdown" />
        <span>Markdown 引用（每行加 &gt;）</span>
      </label>
      <label class="opt">
        <input type="radio" name="format" value="plain" />
        <span>原文照貼（不加符號）</span>
      </label>
    </section>

    <p class="foot">
      設定即時生效，不需重新整理；新增網址後請重新整理該網頁一次。<br />
      內建網址不可移除；自行加入的網址按「移除」即撤銷權限。
    </p>

    <script src="../sites.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
